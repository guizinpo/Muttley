<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mutley — Editar Participante</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="auth.js"></script>
</head>
<body class="app-page">
<aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎓</span><span>Mutley</span></div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
        <div class="nav-section-label">Participantes</div>
        <a href="participantes.html" class="nav-item active">🔍 Consultar</a>
        <div class="nav-section-label">Eventos</div>
        <a href="eventos.html" class="nav-item">🔍 Consultar</a>
        <a href="evento-form.html" class="nav-item">➕ Cadastrar</a>
        <div class="nav-section-label">Medalhas</div>
        <a href="medalhas.html" class="nav-item">🏅 Medalhas</a>
    </nav>
    <div class="sidebar-footer"><a href="#" onclick="logout()" class="nav-item logout">⬅ Sair</a></div>
</aside>

<main class="main-content">
    <header class="topbar">
        <h2>Editar Participante</h2>
        <div class="topbar-user">👤 Administrador</div>
    </header>

    <div class="page-body">
        <div class="section-box form-container">
            <nav class="breadcrumb">
                <a href="participantes.html">Participantes</a> › <span>Editar</span>
            </nav>

            <form id="form-participante" onsubmit="salvar(event)" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome completo <span class="required">*</span></label>
                        <input type="text" id="nome" placeholder="Nome completo" required/>
                        <span class="field-error" id="err-nome"></span>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF <span class="required">*</span></label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14"
                               oninput="mascaraCPF(this)" required/>
                        <span class="field-error" id="err-cpf"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-mail <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="email@exemplo.com" required/>
                        <span class="field-error" id="err-email"></span>
                    </div>
                    <div class="form-group">
                        <label for="tipo">Tipo <span class="required">*</span></label>
                        <select id="tipo" required>
                            <option value="">Selecione...</option>
                            <option value="PALESTRANTE">Palestrante</option>
                            <option value="OUVINTE">Ouvinte</option>
                        </select>
                        <span class="field-error" id="err-tipo"></span>
                    </div>
                </div>

                <div id="toast-sucesso" class="toast toast-success hidden">✅ Participante atualizado com sucesso!</div>
                <div id="erro-geral" class="error-msg hidden"></div>

                <div class="form-actions">
                    <a id="btn-cancelar" href="participantes.html" class="btn btn-ghost">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    checkAuth();

    const params = new URLSearchParams(window.location.search);
    const participanteId = params.get('id');

    if (!participanteId) {
      window.location.href = 'participantes.html';
    }

    function mascaraCPF(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = v;
    }

    function carregarParticipante() {
      authFetch(`${BASE_URL}/api/participantes/${participanteId}`)
        .then(res => res.json())
        .then(p => {
          document.getElementById('nome').value = p.nome;
          document.getElementById('cpf').value = p.cpf;
          document.getElementById('email').value = p.email;
          document.getElementById('tipo').value = p.tipo;
          document.getElementById('btn-cancelar').href = `participante-detalhes.html?id=${participanteId}`;
        });
    }

    function salvar(e) {
      e.preventDefault();
      let valido = true;

      const campos = [
        { id: 'nome', errId: 'err-nome', msg: 'Informe o nome.', check: v => v.trim().length >= 3 },
        { id: 'cpf', errId: 'err-cpf', msg: 'CPF inválido.', check: v => /^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(v) },
        { id: 'email', errId: 'err-email', msg: 'Informe um e-mail válido.', check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
        { id: 'tipo', errId: 'err-tipo', msg: 'Selecione o tipo.', check: v => v !== '' },
      ];

      campos.forEach(c => {
        const val = document.getElementById(c.id).value;
        const errEl = document.getElementById(c.errId);
        if (!c.check(val)) {
          errEl.textContent = c.msg;
          document.getElementById(c.id).classList.add('input-error');
          valido = false;
        } else {
          errEl.textContent = '';
          document.getElementById(c.id).classList.remove('input-error');
        }
      });

      if (!valido) return;

      authFetch(`${BASE_URL}/api/participantes/${participanteId}`, {
        method: 'PUT',
        body: JSON.stringify({
          nome: document.getElementById('nome').value,
          cpf: document.getElementById('cpf').value,
          email: document.getElementById('email').value,
          tipo: document.getElementById('tipo').value
        })
      })
        .then(res => res.json())
        .then(() => {
          document.getElementById('toast-sucesso').classList.remove('hidden');
          setTimeout(() => {
            window.location.href = `participante-detalhes.html?id=${participanteId}`;
          }, 2000);
        })
        .catch(() => {
          document.getElementById('erro-geral').textContent = 'Erro ao salvar. Tente novamente.';
          document.getElementById('erro-geral').classList.remove('hidden');
        });
    }

    carregarParticipante();
</script>
</body>
</html>
