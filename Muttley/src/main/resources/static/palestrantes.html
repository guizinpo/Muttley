<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mutley — Palestrantes</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="auth.js"></script>
</head>
<body class="app-page">
<aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎓</span><span>Mutley</span></div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
        <div class="nav-section-label">Participantes</div>
        <a href="participantes.html" class="nav-item">🔍 Consultar</a>
        <div class="nav-section-label">Palestrantes</div>
        <a href="palestrantes.html" class="nav-item active">🔍 Consultar</a>
        <div class="nav-section-label">Eventos</div>
        <a href="eventos.html" class="nav-item">🔍 Consultar</a>
        <div class="nav-section-label">Medalhas</div>
        <a href="medalhas.html" class="nav-item">🏅 Medalhas</a>
    </nav>
    <div class="sidebar-footer"><a href="#" onclick="logout()" class="nav-item logout">⬅ Sair</a></div>
</aside>

<main class="main-content">
    <header class="topbar">
        <h2>Palestrantes</h2>
        <a href="palestrante-form.html" class="btn btn-primary">+ Novo Palestrante</a>
        <div class="topbar-user">👤 Administrador</div>
    </header>

    <div class="page-body">
        <div class="filter-bar">
            <input type="text" id="filtro-nome" placeholder="Buscar por nome..." class="filter-input"
                   oninput="buscar()"/>
        </div>

        <div class="section-box">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Empresa</th>
                    <th>LinkedIn</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="tbody-palestrantes"></tbody>
            </table>
            <div class="pagination">
                <button class="btn btn-ghost" id="btn-anterior" onclick="mudarPagina(-1)">‹ Anterior</button>
                <span class="page-info" id="info-pagina">Página 1 de 1</span>
                <button class="btn btn-ghost" id="btn-proxima" onclick="mudarPagina(1)">Próxima ›</button>
            </div>
        </div>
    </div>
</main>

<script>
    checkAuth();

    let paginaAtual = 0;
    let totalPaginas = 1;
    let buscaAtual = '';
    let debounceTimer;

    function carregarPalestrantes() {
      let url = `${BASE_URL}/api/palestrantes?page=${paginaAtual}&size=10`;
      if (buscaAtual) url += `&busca=${encodeURIComponent(buscaAtual)}`;

      authFetch(url)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('tbody-palestrantes');
          tbody.innerHTML = '';
          totalPaginas = data.totalPages;

          if (data.content.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">Nenhum palestrante encontrado.</td></tr>';
            return;
          }

          data.content.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${p.nome}</td>
              <td>${p.email}</td>
              <td>${p.empresa || '—'}</td>
              <td>${p.linkedin ? `<a href="https://${p.linkedin}" target="_blank">${p.linkedin}</a>` : '—'}</td>
              <td style="white-space:nowrap;">
                <a href="palestrante-detalhes.html?id=${p.id}" class="btn btn-sm btn-ghost">👁 Ver</a>
                <a href="palestrante-form.html?id=${p.id}" class="btn btn-sm btn-ghost">✏️ Editar</a>
              </td>`;
            tbody.appendChild(tr);
          });

          document.getElementById('info-pagina').textContent = `Página ${paginaAtual + 1} de ${totalPaginas}`;
          document.getElementById('btn-anterior').disabled = paginaAtual === 0;
          document.getElementById('btn-proxima').disabled = paginaAtual >= totalPaginas - 1;
        });
    }

    function buscar() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        buscaAtual = document.getElementById('filtro-nome').value;
        paginaAtual = 0;
        carregarPalestrantes();
      }, 400);
    }

    function mudarPagina(direcao) {
      paginaAtual += direcao;
      carregarPalestrantes();
    }

    carregarPalestrantes();
</script>
</body>
</html>
