<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mutley — Palestrante</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="auth.js"></script>
</head>
<body class="app-page">
<aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎓</span><span>Mutley</span></div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
        <div class="nav-section-label">Participantes</div>
        <a href="participantes.html" class="nav-item">🔍 Consultar</a>
        <div class="nav-section-label">Palestrantes</div>
        <a href="palestrantes.html" class="nav-item">🔍 Consultar</a>
        <div class="nav-section-label">Eventos</div>
        <a href="eventos.html" class="nav-item">🔍 Consultar</a>
        <div class="nav-section-label">Medalhas</div>
        <a href="medalhas.html" class="nav-item">🏅 Medalhas</a>
    </nav>
    <div class="sidebar-footer"><a href="#" onclick="logout()" class="nav-item logout">⬅ Sair</a></div>
</aside>

<main class="main-content">
    <header class="topbar">
        <h2 id="page-title">Cadastrar Palestrante</h2>
        <div class="topbar-user">👤 Administrador</div>
    </header>

    <div class="page-body">
        <div class="section-box form-container">
            <nav class="breadcrumb">
                <a href="palestrantes.html">Palestrantes</a> › <span id="breadcrumb-end">Cadastrar</span>
            </nav>

            <form id="form-palestrante" onsubmit="salvar(event)" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome completo <span class="required">*</span></label>
                        <input type="text" id="nome" placeholder="Nome do palestrante" required/>
                        <span class="field-error" id="err-nome"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="email@exemplo.com" required/>
                        <span class="field-error" id="err-email"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="empresa">Empresa / Instituição</label>
                        <input type="text" id="empresa" placeholder="Ex.: Fatec, USP, Google..."/>
                    </div>
                    <div class="form-group">
                        <label for="linkedin">LinkedIn</label>
                        <input type="text" id="linkedin" placeholder="linkedin.com/in/seuperfil"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group-full">
                        <label for="lattes">Lattes</label>
                        <input type="text" id="lattes" placeholder="lattes.cnpq.br/..."/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group-full">
                        <label for="foto">URL da Foto</label>
                        <input type="text" id="foto" placeholder="https://..."/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group-full">
                        <label for="bio">Mini Bio</label>
                        <textarea id="bio" rows="4"
                                  placeholder="Breve descrição do palestrante para divulgação..."></textarea>
                    </div>
                </div>

                <div id="toast-sucesso" class="toast toast-success hidden">✅ Palestrante salvo com sucesso!</div>
                <div id="erro-geral" class="error-msg hidden"></div>

                <div class="form-actions">
                    <a href="palestrantes.html" class="btn btn-ghost">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    checkAuth();

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');

    if (editId) {
      document.getElementById('page-title').textContent = 'Editar Palestrante';
      document.getElementById('breadcrumb-end').textContent = 'Editar';
      document.querySelector('a[href="palestrantes.html"]').classList.add('active');
      carregarPalestrante();
    }

    function carregarPalestrante() {
      authFetch(`${BASE_URL}/api/palestrantes/${editId}`)
        .then(res => res.json())
        .then(p => {
          document.getElementById('nome').value = p.nome;
          document.getElementById('email').value = p.email;
          document.getElementById('empresa').value = p.empresa || '';
          document.getElementById('linkedin').value = p.linkedin || '';
          document.getElementById('lattes').value = p.lattes || '';
          document.getElementById('foto').value = p.foto || '';
          document.getElementById('bio').value = p.bio || '';
        });
    }

    function salvar(e) {
      e.preventDefault();
      let valido = true;

      const campos = [
        { id: 'nome', errId: 'err-nome', msg: 'Informe o nome.', check: v => v.trim().length >= 3 },
        { id: 'email', errId: 'err-email', msg: 'Informe um e-mail válido.', check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
      ];

      campos.forEach(c => {
        const val = document.getElementById(c.id).value;
        const errEl = document.getElementById(c.errId);
        if (!c.check(val)) {
          errEl.textContent = c.msg;
          document.getElementById(c.id).classList.add('input-error');
          valido = false;
        } else {
          errEl.textContent = '';
          document.getElementById(c.id).classList.remove('input-error');
        }
      });

      if (!valido) return;

      const body = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        empresa: document.getElementById('empresa').value,
        linkedin: document.getElementById('linkedin').value,
        lattes: document.getElementById('lattes').value,
        foto: document.getElementById('foto').value,
        bio: document.getElementById('bio').value
      };

      const url = editId
        ? `${BASE_URL}/api/palestrantes/${editId}`
        : `${BASE_URL}/api/palestrantes`;
      const method = editId ? 'PUT' : 'POST';

      authFetch(url, { method, body: JSON.stringify(body) })
        .then(res => res.json())
        .then(p => {
          document.getElementById('toast-sucesso').classList.remove('hidden');
          setTimeout(() => {
            window.location.href = `palestrante-detalhes.html?id=${p.id}`;
          }, 2000);
        })
        .catch(() => {
          document.getElementById('erro-geral').textContent = 'Erro ao salvar. Verifique os dados.';
          document.getElementById('erro-geral').classList.remove('hidden');
        });
    }
</script>
</body>
</html>
