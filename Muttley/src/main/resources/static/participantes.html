<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mutley — Participantes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="auth.js"></script>
</head>
<body class="app-page">
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎓</span><span>Mutley</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
      <a href="participantes.html" class="nav-item active">👥 Participantes</a>
      <a href="palestrantes.html" class="nav-item">🎤 Palestrantes</a>
      <a href="eventos.html" class="nav-item">📅 Eventos</a>
      <a href="medalhas.html" class="nav-item">🏅 Medalhas</a>
    </nav>
    <a href="#" onclick="logout()" class="nav-item logout">⬅ Sair</a>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h2>Participantes</h2>
      <div class="topbar-user">👤 Administrador</div>
    </header>

    <div class="page-body">
      <div class="filter-bar">
        <input type="text" id="filtro-nome" placeholder="Buscar por nome ou CPF..." class="filter-input" oninput="buscar()" />
        <select id="filtro-tipo" class="filter-select" onchange="buscar()">
          <option value="">Todos os tipos</option>
          <option value="PALESTRANTE">Palestrante</option>
          <option value="OUVINTE">Ouvinte</option>
        </select>
      </div>

      <div class="section-box">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>E-mail</th>
              <th>Tipo</th>
            </tr>
          </thead>
          <tbody id="tbody-participantes"></tbody>
        </table>
        <div class="pagination">
          <button class="btn btn-ghost" id="btn-anterior" onclick="mudarPagina(-1)">‹ Anterior</button>
          <span class="page-info" id="info-pagina">Página 1 de 1</span>
          <button class="btn btn-ghost" id="btn-proxima" onclick="mudarPagina(1)">Próxima ›</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    checkAuth();

    let paginaAtual = 0;
    let totalPaginas = 1;
    let buscaAtual = '';
    let tipoAtual = '';
    let debounceTimer;

    function renderTabela(participantes) {
      const tbody = document.getElementById('tbody-participantes');
      tbody.innerHTML = '';
      if (participantes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;">Nenhum participante encontrado.</td></tr>';
        return;
      }
      participantes.forEach(p => {
        const badgeClass = p.tipo === 'PALESTRANTE' ? 'badge-blue' : 'badge-green';
        const tipoLabel = p.tipo === 'PALESTRANTE' ? 'Palestrante' : 'Ouvinte';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.nome}</td>
          <td><a href="participante-detalhes.html?id=${p.id}" class="cpf-link">${p.cpf}</a></td>
          <td>${p.email}</td>
          <td><span class="badge ${badgeClass}">${tipoLabel}</span></td>`;
        tbody.appendChild(tr);
      });
    }

    function atualizarPaginacao(page) {
      totalPaginas = page.totalPages;
      paginaAtual = page.number;
      document.getElementById('info-pagina').textContent = `Página ${paginaAtual + 1} de ${totalPaginas}`;
      document.getElementById('btn-anterior').disabled = paginaAtual === 0;
      document.getElementById('btn-proxima').disabled = paginaAtual >= totalPaginas - 1;
    }

    function carregarParticipantes() {
      let url = `${BASE_URL}/api/participantes?page=${paginaAtual}&size=10`;
      if (buscaAtual) url += `&busca=${encodeURIComponent(buscaAtual)}`;
      if (tipoAtual) url += `&tipo=${tipoAtual}`;

      authFetch(url)
        .then(res => res.json())
        .then(data => {
          renderTabela(data.content);
          atualizarPaginacao(data);
        })
        .catch(err => console.error('Erro ao carregar participantes:', err));
    }

    function buscar() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        buscaAtual = document.getElementById('filtro-nome').value;
        tipoAtual = document.getElementById('filtro-tipo').value;
        paginaAtual = 0;
        carregarParticipantes();
      }, 400);
    }

    function mudarPagina(direcao) {
      paginaAtual += direcao;
      carregarParticipantes();
    }

    carregarParticipantes();
  </script>
</body>
</html>
